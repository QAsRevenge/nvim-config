############################################################
# 🧠 GENERAL
############################################################
editor /usr/local/bin/nvim
open_url_with default
copy_on_select yes
strip_trailing_spaces smart
resize_in_steps no
remember_window_size yes

############################################################
# 🔤 FONT
############################################################
# font_family JetBrainsMono Nerd Font
font_size 15.0

# Ligatures
font_features liga calt

# Line spacing
adjust_line_height 135%

# Fine tuning
modify_font underline_position 9
modify_font underline_thickness 150%
modify_font strikethrough_position 2px

############################################################
# 🎨 COLORS & APPEARANCE
############################################################
# selection_foreground #0a0f1a
# selection_background #00f0ff

# Transparency
background_opacity 0.84
dynamic_background_opacity yes

# macOS wide color gamut
macos_colorspace displayp3

############################################################
# 🖱️ CURSOR
############################################################
cursor_shape beam
cursor_blink_interval 0.35

cursor_trail 12
cursor_trail_decay 0.05 0.15
cursor_trail_start_threshold 2
# cursor #00f0ff
# cursor_text_color #0a0f1a

############################################################
# 🪟 WINDOW
############################################################
hide_window_decorations yes

initial_window_width 2056
initial_window_height 1329

# Spacing
single_window_padding_width 10
window_margin_width 8
window_border_width 1.5pt
single_window_margin_width 0

enabled_layouts Tall,*

mouse_hide_wait -1

############################################################
# 🧩 TABS
############################################################
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_separator " "

tab_bar_margin_height 0 0
tab_bar_margin_width 0
tab_bar_min_tabs 1

# Titles
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_title_template "{fmt.fg.cyan}󰆍 {fmt.fg.tab}{title}"

############################################################
# ⌨️ KEYBINDINGS
############################################################
# New windows
map cmd+enter new_window_with_cwd
map cmd+n detach_window new-tab-right

# Tab navigation
map cmd+alt+right next_tab
map cmd+alt+left previous_tab

# Tab switching (fixed duplicate)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7

############################################################
# 🍎 MACOS SETTINGS
############################################################
macos_option_as_alt no
macos_show_window_title_in menubar

############################################################
# 🔗 LINKS
############################################################
underline_hyperlinks always
undercurl_style thin-dense

############################################################
# 🌌 CYBERPUNK GLASS THEME
############################################################

foreground              #E6F3FF
background              #080B12

selection_foreground    #080B12
selection_background    #00F7FF

cursor                  #00F7FF
cursor_text_color       #080B12

url_color               #00F7FF

active_border_color     #00F7FF
inactive_border_color   #1C2433
bell_border_color       #FF3D81

active_tab_foreground   #080B12
active_tab_background   #00F7FF

inactive_tab_foreground #7A8495
inactive_tab_background #111827

mark1_foreground        #080B12
mark1_background        #00F7FF

color0  #111827
color1  #FF3D81
color2  #57FFB3
color3  #FFD166
color4  #38BDF8
color5  #B388FF
color6  #00F7FF
color7  #DCE6F3

color8  #4B5563
color9  #FF66A8
color10 #7AFFC7
color11 #FFE08A
color12 #67D3FF
color13 #D7AFFF
color14 #7AFFFF
color15 #FFFFFF


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


